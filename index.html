html,body{margin:0}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--g2);color:#fff;cursor:pointer}
.btn.full{width:100%;margin-top:14px}.btn.sm{padding:6px 12px;font-size:13px}.btn.ghost{background:var(--in);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--redi)}

table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}

nav button.on{background:var(--g2);color:#fff;font-weight:700}

.dot{position:absolute;top:0;left:50%;background:var(--sandi);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}

<script>
const KEY="lands-system-v1";
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("en-US");
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){
  const d=(n)=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
  return{rates:{sar:375,usd:1600},
  tenants:[
   {id:"t1",name:"أحمد محمد",user:"ahmed",pass:"1234",land:"أرض رقم 001 - الجبارة - مريس",share:25,due:d(20),on:1},
   {id:"t2",name:"سالم علي",user:"salem",pass:"1234",land:"أرض رقم 002 - الجبارة - مريس",share:25,due:d(-12),on:1},
   {id:"t3",name:"خالد ناصر",user:"khaled",pass:"1234",land:"أرض رقم 003 - ضوران - مريس",share:25,due:d(35),on:1}],
  sales:[
   {id:uid(),tid:"t1",crop:"قات",date:d(-8),qty:"100 ربطة",amount:385000},
   {id:uid(),tid:"t2",crop:"قات",date:d(-20),qty:"200 ربطة",amount:700000},
   {id:uid(),tid:"t3",crop:"بن",date:d(-15),qty:"170 كيلو",amount:595000}],
  payments:[
   {id:uid(),tid:"t1",amount:93750,date:d(-5),note:"دفعة أولى",st:"c"},
   {id:uid(),tid:"t3",amount:50000,date:d(-1),note:"تحويل بنكي",st:"p"}],
  wallets:[{id:uid(),name:"المحفظة الأولى",holder:"اسم صاحب المحفظة",phone:"7xx xxx xxx"},{id:uid(),name:"المحفظة الثانية",holder:"اسم صاحب المحفظة",phone:"7xx xxx xxx"}],
  admin:{user:"admin",pass:"admin123",name:"المالك"}};
}
let S,user=null,page="home";
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.tenants)S=seed();
  if(!S.wallets)S.wallets=seed().wallets;
  S.tenants.forEach(t=>{if(!t.share)t.share=25});
  S.sales.forEach(x=>{if(x.amount==null){x.amount=(x.qty||0)*(x.price||0);x.qty=x.qty?x.qty+" "+(x.unit||""):""}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function calc(t){
  const sales=S.sales.filter(x=>x.tid==t.id).reduce((a,x)=>a+x.amount,0);
  const owed=sales*t.share/100;
  const paid=S.payments.filter(x=>x.tid==t.id&&x.st=="c").reduce((a,x)=>a+x.amount,0);
  const pend=S.payments.filter(x=>x.tid==t.id&&x.st=="p").reduce((a,x)=>a+x.amount,0);
  return{sales,owed,paid,pend,left:Math.max(0,owed-paid)};
}
const T=id=>S.tenants.find(t=>t.id==id)||{name:"محذوف"};
const stat=(v,l,c,w)=>`<div class="stat s-${c} ${w?"wide":""}"><b>${v}</b><span>${l}</span></div>`;
const badge=s=>s=="c"?'<span class="st-c">مؤكدة</span>':s=="p"?'<span class="st-p">بانتظار المراجعة</span>':'<span class="st-r">مرفوضة</span>';

function loginView(){
  document.getElementById("nav").hidden=true;
  app.innerHTML=`<div class="card login"><div class="pad">
  <h1 style="margin:0">مريس</h1><p class="mut" style="margin-top:2px">إدارة الأراضي الزراعية</p>
  <h2>تسجيل الدخول</h2><p class="mut">الحسابات يصدرها المالك فقط. إن لم يكن لديك حساب، تواصل مع المالك.</p>
  <label>اسم المستخدم</label><input id="u" autocomplete="username" autocapitalize="none">
  <label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn full" onclick="doLogin()">دخول</button>
  <div class="card pad chips" style="margin:14px 0 0;background:var(--in)"><div class="mut">حسابات للتجربة (اضغط للتعبئة)</div>
  <button class="btn sm ghost" onclick="fill('admin','admin123')">المالك (admin)</button>
  <button class="btn sm ghost" onclick="fill('ahmed','1234')">المستأجر أحمد (ahmed)</button>
  <button class="btn sm ghost" onclick="fill('salem','1234')">المستأجر سالم (salem)</button></div>
  </div></div>`;
}
function fill(u,p){document.getElementById("u").value=u;document.getElementById("p").value=p}
function doLogin(){
  const u=document.getElementById("u").value.trim().toLowerCase(),p=document.getElementById("p").value;
  if(u==S.admin.user&&p==S.admin.pass)user={role:"owner"};
  else{const t=S.tenants.find(t=>t.user==u&&t.pass==p&&t.on);if(t)user={role:"tenant",id:t.id}}
  if(!user){document.getElementById("err").textContent="اسم المستخدم أو كلمة المرور غير صحيحة.";return}
  page="home";render();
}
function logout(){user=null;render()}
function go(p){EW=null;page=p;render();window.scrollTo(0,0)}

function nav(){
  const o=user.role=="owner";
  const pendN=S.payments.filter(p=>p.st=="p").length;
  const items=o?[["home","🏠","الرئيسية"],["tenants","👥","المستأجرون"],["sales","🛒","المبيعات"],["pay","💳","المدفوعات"],["rates","⚙","الإعدادات"],["rep","📊","التقارير"]]
   :[["home","🏠","الرئيسية"],["hist","☰","السجل"],["me","👤","بياناتي"],["out","⎋","خروج"]];
  const n=document.getElementById("nav");n.hidden=false;
  n.innerHTML=items.map(([k,i,l])=>`<button class="${page==k?"on":""}" onclick="${k=="out"?"logout()":`go('${k}')`}"><i>${i}</i>${l}${o&&k=="pay"&&pendN?`<span class="dot">${pendN}</span>`:""}</button>`).join("");
}
function render(){
  if(!user)return loginView();
  nav();
  (user.role=="owner"?ownerPage:tenantPage)();
  app.insertAdjacentHTML("afterbegin",`<div class="top noprint"><span class="mut">${user.role=="owner"?"المالك":esc(T(user.id).name)}</span><button class="btn sm ghost" onclick="logout()">تسجيل الخروج ⎋</button></div>`);
}

/* ---------- Owner ---------- */
function ownerPage(){
  const fn={home:oHome,tenants:oTenants,sales:oSales,pay:oPay,rates:oRates,rep:oRep}[page]||oHome;fn();
}
function totals(){
  return S.tenants.reduce((a,t)=>{const c=calc(t);a.sales+=c.sales;a.owed+=c.owed;a.paid+=c.paid;a.pend+=c.pend;return a},{sales:0,owed:0,paid:0,pend:0});
}
function oHome(){
  const a=totals();

  app.innerHTML=`<div class="card hero"><div class="ico">🛡</div><div><h2>لوحة المالك</h2><p>${S.tenants.length} أراضٍ - ${S.tenants.filter(t=>t.on).length} حسابات نشطة</p></div></div>

  <div class="grid">${stat(fmt(a.owed),"نصيبك من مبيعات المستأجرين (ريال)","sand",1)}
  ${stat(fmt(a.paid),"المورّد فعلياً (ريال)","mint")}${stat(fmt(a.pend),"بانتظار مراجعتك (ريال)","sky")}
  ${stat((a.paid/S.rates.usd).toFixed(2),"المورّد بالدولار","sand")}${stat((a.paid/S.rates.sar).toFixed(2),"المورّد بالريال السعودي","mint")}</div>
  </div>
  <div class="card"><div class="pad top"><h3>المستأجرون والأراضي</h3><button class="btn sm" onclick="go('tenants')">إضافة مستأجر</button></div>${tenantTable()}</div>`;
}
function tenantTable(){
  const now=today();
  return `<div class="scroll"><table><tr><th>المستأجر</th><th>الأرض</th><th>المبيعات</th><th>المورّد</th></tr>
  ${S.tenants.map(t=>{const c=calc(t);return`<tr><td>${esc(t.name)}</td><td>${esc(t.land)}</td><td>${fmt(c.sales)}</td><td>${fmt(c.paid)}</td></tr>`}).join("")}</table></div>`;
}
function oTenants(){
  app.innerHTML=`<div class="card"><div class="head">إضافة مستأجر جديد</div><div class="pad">
  <label>الاسم</label><input id="n"><label>الأرض</label><input id="l" placeholder="أرض رقم 004 - الجبارة - مريس">
  <div class="row"><div><label>اسم المستخدم</label><input id="u" autocapitalize="none"></div><div><label>كلمة المرور</label><input id="p"></div></div>
  <div class="row"><div><label>نسبة المالك %</label><input id="s" type="number" value="25"></div></div>
  <div class="err" id="err"></div><button class="btn full" onclick="addTenant()">إضافة المستأجر</button></div></div>
  <div class="card"><div class="pad top"><h3>الحسابات</h3></div><div class="scroll"><table><tr><th>الاسم</th><th>المستخدم</th><th>النسبة %</th><th></th></tr>
  ${S.tenants.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.user)}</td><td><input type="number" value="${t.share}" style="width:72px;padding:6px" onchange="setShare('${t.id}',this.value)"></td><td><button class="btn sm red" onclick="delTenant('${t.id}')">حذف</button></td></tr>`).join("")||`<tr><td colspan=4 class="empty">لا يوجد مستأجرون. أضف أول مستأجر من النموذج أعلاه.</td></tr>`}</table></div></div>`;
}
async function addTenant(){
  const v=id=>document.getElementById(id).value.trim(),e=document.getElementById("err");
  if(!v("n")||!v("l")||!v("u")||!v("p"))return e.textContent="أكمل الاسم والأرض واسم المستخدم وكلمة المرور.";
  if(S.tenants.some(t=>t.user==v("u").toLowerCase())||v("u")==S.admin.user)return e.textContent="اسم المستخدم مستخدم من قبل، اختر اسماً آخر.";
  
  const newTenant = {
    id: uid(),
    name: v("n"),
    land: v("l"),
    user: v("u").toLowerCase(),
    pass: v("p"),
    share: +v("s")||25,
    on: 1
  };

  // إرسال البيانات مباشرة إلى جدول Supabase
  const { error } = await _supabase.from('lands').insert([{
    title: newTenant.land,
    price: 0
  }]);

  if(error) {
    console.error('خطأ في مزامنة Supabase:', error);
  }

  S.tenants.push(newTenant);
  save();
  render();
}
function setShare(id,v){const t=S.tenants.find(x=>x.id==id);if(t&&+v>=0){t.share=+v;save()}}
function delTenant(id){
  if(!confirm("حذف المستأجر مع كل مبيعاته ومدفوعاته؟"))return;
  S.tenants=S.tenants.filter(t=>t.id!=id);S.sales=S.sales.filter(x=>x.tid!=id);S.payments=S.payments.filter(x=>x.tid!=id);save();render();
}
function oSales(){
  const rows=[...S.sales].sort((a,b)=>b.date.localeCompare(a.date));
  app.innerHTML=`<div class="card"><div class="pad top"><h3>كل المبيعات</h3></div><div class="scroll"><table><tr><th>التاريخ</th><th>المستأجر</th><th>المحصول</th><th>الكمية</th><th>الإجمالي</th></tr>
  ${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(T(x.tid).name)}</td><td>${esc(x.crop)}</td><td>${esc(x.qty||"-")}</td><td>${fmt(x.amount)}</td></tr>`).join("")||`<tr><td colspan=5 class="empty">لم يسجل أحد عملية بيع بعد.</td></tr>`}</table></div></div>`;
}
function oPay(){
  const rows=[...S.payments].sort((a,b)=>b.date.localeCompare(a.date));
  app.innerHTML=`<div class="card"><div class="pad top"><h3>المدفوعات</h3></div><div class="scroll"><table><tr><th>التاريخ</th><th>المستأجر</th><th>المبلغ</th><th>الحالة</th><th></th></tr>
  ${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(T(x.tid).name)}<div class="mut">${esc(x.wallet||"")} ${x.ref?"- رقم "+esc(x.ref):""} ${esc(x.note||"")}</div>${x.img?`<button class="btn sm ghost" onclick="showImg('${x.id}')">عرض السند</button>`:""}</td><td>${fmt(x.amount)}</td><td>${badge(x.st)}</td><td>${x.st=="p"?`<button class="btn sm" onclick="setPay('${x.id}','c')">تأكيد</button> <button class="btn sm red" onclick="setPay('${x.id}','r')">رفض</button>`:""}</td></tr>`).join("")||`<tr><td colspan=5 class="empty">لا توجد دفعات بعد.</td></tr>`}</table></div></div>`;
}
function setPay(id,st){S.payments.find(x=>x.id==id).st=st;save();render()}
function oRates(){

function shrink(f,ok,bad){const r=new FileReader();r.onerror=bad;
  r.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6))};im.src=r.result};r.readAsDataURL(f)}

/* سند المبيعات: يوزّع الدفعات المرفقة بسند على المبيعات الأقدم أولاً */
function sStat(){
  const m={};
  S.tenants.forEach(t=>{
    let r=S.payments.filter(p=>p.tid==t.id&&p.st!="r"&&p.img).reduce((a,p)=>a+p.amount,0);
    S.sales.filter(x=>x.tid==t.id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
      const s=x.amount*(t.share||0)/100;
      if(r>=s-.5){m[x.id]="y";r-=s}else if(r>0){m[x.id]="h";r=0}else m[x.id]="n";
    });
  });
  return m;
}

function editSale(id){
  const x=S.sales.find(s=>s.id==id);if(!x)return;
  modal(`<h3 style="margin-top:0">تعديل عملية البيع</h3><p class="mut" style="margin:0">${esc(T(x.tid).name)}</p>
  <label>المحصول</label><select id="ec"><option ${x.crop=="قات"?"selected":""}>قات</option><option ${x.crop=="بن"?"selected":""}>بن</option></select>
  <label>التاريخ</label><input id="ed" type="date" value="${x.date}"><label>الكمية (اختياري)</label><input id="eq" value="${esc(x.qty||"")}">
  <label>قيمة البيع (ريال يمني)</label><input id="ea" type="number" value="${x.amount}"><div class="err" id="eer"></div>
  <button class="btn full" onclick="saveSale('${id}')">حفظ التعديل</button>`);
}
function saveSale(id){
  const x=S.sales.find(s=>s.id==id),g=k=>document.getElementById(k).value,a=+g("ea");
  if(!x)return;if(!(a>0))return document.getElementById("eer").textContent="أدخل قيمة البيع برقم أكبر من صفر.";
  x.crop=g("ec");x.date=g("ed")||x.date;x.qty=g("eq").trim();x.amount=a;save();closeM();render();
}

/* ---------- التقارير ---------- */
function oRep(){
  const sm=sStat(),M={},C={};
  const mo=k=>M[k]=M[k]||{s:0,sh:0,c:0};
  S.sales.forEach(x=>{const m=mo(ym(x.date));m.s+=x.amount;m.sh+=x.amount*(T(x.tid).share||0)/100;C[x.crop]=(C[x.crop]||0)+x.amount});
  S.payments.filter(p=>p.st=="c").forEach(p=>{mo(ym(p.date)).c+=p.amount});
  const late=S.tenants.map(t=>{const c=calc(t),old=S.sales.filter(x=>x.tid==t.id&&sm[x.id]!="y").sort((a,b)=>a.date.localeCompare(b.date))[0];
    return{t,amt:Math.max(0,c.owed-c.paid-c.pend),days:old?Math.floor((Date.now()-new Date(old.date))/864e5):0}}).filter(r=>r.amt>0&&r.days>=7);
  const first=today().slice(0,8)+"01";
  app.innerHTML=`<div class="card pad"><h3 style="margin-top:0">كشف الحساب الشهري (Excel)</h3>
  <div class="row"><div><label>من تاريخ</label><input id="xf" type="date" value="${first}"></div><div><label>إلى تاريخ</label><input id="xt" type="date" value="${today()}"></div></div>
  <label>المستأجر</label><select id="xs"><option value="">كل المستأجرين</option>${S.tenants.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>
  <label>سعر الصرف المعتمد في الملف</label><select id="xm"><option value="sys">سعر صرف النظام الحالي</option><option value="day">سعر يوم التحويل أو البيع</option></select>
  <div class="err" id="xe"></div><button class="btn full" onclick="exportXls()">تصدير كشف الحساب Excel</button></div>
  <div class="card pad"><h3 style="margin-top:0">المبيعات والتحصيل حسب الشهر</h3><div class="scroll"><table><tr><th>الشهر</th><th>المبيعات</th><th>حصتك من المبيعات</th><th>المحصّل</th></tr>
  ${Object.keys(M).sort().reverse().map(k=>`<tr><td>${k}</td><td>${fmt(M[k].s)}</td><td>${fmt(M[k].sh)}</td><td>${fmt(M[k].c)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">لا توجد بيانات بعد.</td></tr>`}</table></div></div>
  <div class="card pad"><h3 style="margin-top:0">المبيعات حسب المحصول</h3><table>${["قات","بن"].map(k=>`<tr><td>${k}</td><td>${fmt(C[k]||0)} ريال</td></tr>`).join("")}</table></div>
  <div class="card pad"><h3 style="margin-top:0">المتأخرون</h3><table>${late.map(r=>`<tr><td><b>${esc(r.t.name)}</b></td><td>${fmt(r.amt)} ريال</td><td class="st-r">متأخر ${r.days} يوم</td></tr>`).join("")||`<tr><td class="empty">لا يوجد متأخرون. يُحتسب التأخر بعد 7 أيام من البيع بدون توريد.</td></tr>`}</table></div>
  <div class="card pad"><h3 style="margin-top:0">كشف حساب لكل مستأجر</h3><div class="scroll"><table><tr><th>المستأجر</th><th>الأرض</th><th>الاتفاق</th><th>المبيعات</th><th>نصيبك</th><th>المحصّل</th><th>المتبقي</th></tr>
  ${S.tenants.map(t=>{const c=calc(t);return`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.land)}</td><td>${t.share}% من المبيعات</td><td>${fmt(c.sales)}</td><td>${fmt(c.owed)}</td><td>${fmt(c.paid)}</td><td>${fmt(c.left)}</td></tr>`}).join("")}</table></div>
  <button class="btn sm ghost noprint" style="margin-top:12px" onclick="window.print()">طباعة</button></div>`;
}
async function exportXls(){
  const g=k=>document.getElementById(k).value,e=document.getElementById("xe"),f=g("xf"),t=g("xt"),tid=g("xs");
  if(!f||!t||f>t)return e.textContent="حدد تاريخ بداية ونهاية صحيحين.";
  if(!window.XLSX)return e.textContent="تعذّر تحميل مكتبة Excel، تأكد من الاتصال بالإنترنت.";
  const dl=window.claude&&await claude.use("downloads");
  if(!dl)return e.textContent="التنزيل غير متاح في هذا العرض. افتح الصفحة من رابطها داخل Claude.";
  const ts=S.tenants.filter(x=>!tid||x.id==tid),ids=ts.map(x=>x.id),inR=d=>d>=f&&d<=t,sm=sStat();
  const sl=S.sales.filter(x=>ids.includes(x.tid)&&inR(x.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const pm=S.payments.filter(p=>ids.includes(p.tid)&&inR(p.date)&&p.st=="c");
  const A=[["المستأجر","الأرض","النسبة %","المبيعات","نصيبك","المحصّل","المتبقي"]];
  ts.forEach(x=>{const s=sl.filter(y=>y.tid==x.id).reduce((a,y)=>a+y.amount,0),c=pm.filter(p=>p.tid==x.id).reduce((a,p)=>a+p.amount,0),sh=s*x.share/100;A.push([x.name,x.land,x.share,s,sh,c,sh-c])});
  const B=[["التاريخ","المستأجر","المحصول","الكمية","المبلغ","نسبتك","السند"]].concat(sl.map(x=>[x.date,T(x.tid).name,x.crop,x.qty||"",x.amount,x.amount*T(x.tid).share/100,{y:"مرفوع",h:"جزئي",n:"غير مرفوع"}[sm[x.id]]]));
  const D=[["التاريخ","المستأجر","المبلغ","المحفظة","رقم العملية"]].concat(pm.map(p=>[p.date,T(p.tid).name,p.amount,p.wallet||"",p.ref||""]));
  const wb=XLSX.utils.book_new();
  [["كشف الحساب",A],["المبيعات",B],["المدفوعات",D]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));
  wb.Workbook={Views:[{RTL:true}]};
  try{await dl.save({filename:`statement-${f}_${t}.xlsx`,data:new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})])});e.textContent=""}
  catch(x){e.textContent=x&&x.code=="declined"?"":"تعذّر حفظ الملف."}
}

function saveWA(){S.wa=document.getElementById("wa").value.trim();save();document.getElementById("wok").textContent="تم حفظ الرقم."}

/* ---------- المستأجر ---------- */
let LF=null,LM="";
function waAfter(p){
  const m=`السلام عليكم، أنا ${T(user.id).name}.\nأرسلت توريداً بمبلغ ${fmt(p.amount)} ريال إلى ${p.wallet}${p.ref?`\nرقم العملية: ${p.ref}`:""}\nمرفق صورة السند، أرجو التأكيد.`;
  LM=m;
  if(!S.wa)return modal(`<h3 style="margin-top:0">تم إرسال التوريد للمراجعة</h3><p class="mut">لم يضف المالك رقم واتساب بعد.</p>`);
  const can=LF&&navigator.canShare&&navigator.canShare({files:[LF]});
  modal(`<h3 style="margin-top:0">تم إرسال التوريد للمراجعة</h3><p class="mut">أرسل السند للمالك على واتساب ليتأكد من وصول التحويل بسرعة.</p>
  <div class="total" style="white-space:pre-wrap;margin-top:0">${esc(m)}</div>
  ${can?'<button class="btn full" onclick="shareWA()">إرسال السند عبر واتساب</button>':""}
  <a class="btn full a ${can?"ghost":""}" target="_blank" rel="noopener" href="${waUrl(m)}">${can?"إرسال الرسالة فقط":"فتح واتساب بالرسالة الجاهزة"}</a>`);
}
function shareWA(){navigator.share({files:[LF],text:LM}).catch(()=>{})}
function openWA(){
  const m=`السلام عليكم، أنا ${T(user.id).name}، أحتاج مساعدة بخصوص حسابي.`;
  modal(S.wa?`<h3 style="margin-top:0">تواصل معنا</h3><p class="mut">سيفتح واتساب برسالة جاهزة للمالك.</p><a class="btn full a" target="_blank" rel="noopener" href="${waUrl(m)}">فتح واتساب</a>`:`<h3 style="margin-top:0">تواصل معنا</h3><p class="mut">لم يضف المالك رقم واتساب بعد.</p>`);
}
function sendPay(){
  const e=document.getElementById("perr"),a=+document.getElementById("pa").value,ref=document.getElementById("pr2").value.trim(),f=document.getElementById("pf").files[0];
  const w=(S.wallets||[]).find(x=>x.id==document.getElementById("pw").value);
  if(!(a>0))return e.textContent="أدخل المبلغ المحوّل.";
  if(!w)return e.textContent="لا توجد محفظة للتحويل إليها. تواصل مع المالك.";
  if(!f)return e.textContent="أرفق صورة السند أولاً. لا يمكن إضافة التوريد بدونها.";
  const done=img=>{const p={id:uid(),tid:user.id,amount:a,date:today(),wallet:w.name,ref,img:img||"",note:"",st:"p"};S.payments.push(p);save();LF=f;go("hist");waAfter(p)};
  shrink(f,done,()=>{e.textContent="تعذّر قراءة الصورة، جرّب صورة أخرى."});
}
function tMe(){
  const t=T(user.id),c=calc(t),r=(l,v)=>`<small>${l}</small><b>${esc(v||"-")}</b>`;
  app.innerHTML=`<div class="card pad"><h3 style="margin-top:0">بياناتي</h3><div class="kv">${r("الاسم",t.name)}${r("اسم المستخدم",t.user)}${r("الأرض",t.land)}${r("رقم الهاتف",t.phone)}${r("اتفاق المالك",t.share+"% من المبيعات")}${r("بداية العقد",t.start)}${r("نهاية العقد",t.end)}${r("إجمالي المبيعات",fmt(c.sales)+" ريال")}${r("نصيب المالك",fmt(c.owed)+" ريال")}${r("المورّد المؤكد",fmt(c.paid)+" ريال")}</div>
  <label>كلمة مرور جديدة</label><input id="np" type="password"><div class="err" id="err"></div><button class="btn full" onclick="chPass()">تغيير كلمة المرور</button></div>`;
}

async function exportXls(){
  const g=k=>document.getElementById(k).value,e=document.getElementById("xe"),f=g("xf"),t=g("xt"),tid=g("xs"),day=g("xm")=="day";
  if(!f||!t||f>t)return e.textContent="حدد تاريخ بداية ونهاية صحيحين.";
  if(!window.XLSX)return e.textContent="تعذّر تحميل مكتبة Excel، تأكد من الاتصال بالإنترنت.";
  const dl=window.claude&&await claude.use("downloads");
  if(!dl)return e.textContent="التنزيل غير متاح في هذا العرض. افتح الصفحة من رابطها داخل Claude.";
  const R=o=>day&&o.rate?o.rate:S.rates,r2=n=>Math.round(n*100)/100;
  const usd=(o,v)=>v/R(o).usd,sar=(o,v)=>v/R(o).sar,sum=(a,fn)=>r2(a.reduce((s,x)=>s+fn(x),0));
  const ts=S.tenants.filter(x=>!tid||x.id==tid),ids=ts.map(x=>x.id),inR=d=>d>=f&&d<=t,sm=sStat();
  const sl=S.sales.filter(x=>ids.includes(x.tid)&&inR(x.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const pm=S.payments.filter(p=>ids.includes(p.tid)&&inR(p.date)&&p.st=="c");
  const shr=x=>x.amount*T(x.tid).share/100;
  const S1=sum(sl,x=>x.amount),H1=sum(sl,shr),C1=sum(pm,p=>p.amount);
  const S2=sum(sl,x=>usd(x,x.amount)),H2=sum(sl,x=>usd(x,shr(x))),C2=sum(pm,p=>usd(p,p.amount));
  const S3=sum(sl,x=>sar(x,x.amount)),H3=sum(sl,x=>sar(x,shr(x))),C3=sum(pm,p=>sar(p,p.amount));
  const A=[["المستأجر","الأرض","النسبة %","المبيعات","نصيبك","المحصّل","المتبقي"]];
  ts.forEach(x=>{const s=sum(sl.filter(y=>y.tid==x.id),y=>y.amount),c=sum(pm.filter(p=>p.tid==x.id),p=>p.amount),sh=sum(sl.filter(y=>y.tid==x.id),shr);A.push([x.name,x.land,x.share,s,sh,c,r2(sh-c)])});
  A.push(["الإجمالي","","",S1,H1,C1,r2(H1-C1)],[],
    ["الإجمالي بالعملات","المبيعات","نصيبك","المحصّل","المتبقي"],
    ["ريال يمني",S1,H1,C1,r2(H1-C1)],["دولار",S2,H2,C2,r2(H2-C2)],["ريال سعودي",S3,H3,C3,r2(H3-C3)],
    ["سعر الصرف المعتمد",day?"سعر يوم العملية لكل بيع وتحويل":`دولار = ${S.rates.usd} ريال يمني، ريال سعودي = ${S.rates.sar} ريال يمني (سعر النظام)`]);
  const B=[["التاريخ","المستأجر","المحصول","الكمية","المبلغ (ريال يمني)","نسبتك (ريال يمني)","المبلغ بالدولار","المبلغ بالريال السعودي","السند"]]
    .concat(sl.map(x=>[x.date,T(x.tid).name,x.crop,x.qty||"",x.amount,r2(shr(x)),r2(usd(x,x.amount)),r2(sar(x,x.amount)),{y:"مرفوع",h:"جزئي",n:"غير مرفوع"}[sm[x.id]]]),[["الإجمالي","","","",S1,H1,S2,S3,""]]);
  const D=[["التاريخ","المستأجر","المبلغ (ريال يمني)","المحفظة","رقم العملية","سعر الدولار","سعر الريال السعودي","بالدولار","بالريال السعودي"]]
    .concat(pm.map(p=>[p.date,T(p.tid).name,p.amount,p.wallet||"",p.ref||"",R(p).usd,R(p).sar,r2(usd(p,p.amount)),r2(sar(p,p.amount))]),[["الإجمالي","",C1,"","","","",C2,C3]]);
  const wb=XLSX.utils.book_new();
  [["كشف الحساب",A],["المبيعات",B],["المدفوعات",D]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));
  wb.Workbook={Views:[{RTL:true}]};
  try{await dl.save({filename:`statement-${f}_${t}.xlsx`,data:new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})])});e.textContent=""}
  catch(x){e.textContent=x&&x.code=="declined"?"":"تعذّر حفظ الملف."}
}

load();render();
