<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الأراضي الزراعية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16221b;--mut:#6b7a72;--g:#2a4a3a;--g2:#3f6e50;--line:#dfe5e1;--sand:#faf0e1;--sandi:#d99a3a;--mint:#e6f1e9;--sky:#e7ecf8;--red:#f7e1df;--redi:#a8321f;--in:#f3f5f4}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--ink:#e8efe9;--mut:#9aaaa1;--g:#173226;--g2:#5fa079;--line:#2c3a33;--sand:#33291a;--mint:#1f3328;--sky:#1e2638;--red:#3a1f1c;--redi:#ff9b8a;--in:#232f28}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:15px}
button,input,select{font-family:inherit}h2,h3{font-weight:800}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.pad{padding:16px}
.hero{display:flex;align-items:center;gap:12px;padding:18px}
.ico{width:46px;height:46px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:20px;flex:none}
.hero h2{margin:0;font-size:19px}.hero p{margin:2px 0 0;color:var(--mut);font-size:13px}
.badge{display:inline-block;background:var(--mint);color:var(--g2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.alert{background:var(--red);color:var(--redi);border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:16px;padding:14px}.stat b{display:block;font-size:22px;word-break:break-all}.stat span{font-size:12.5px;color:var(--mut)}
.s-sand{background:var(--sand)}.s-mint{background:var(--mint)}.s-sky{background:var(--sky)}.wide{grid-column:1/-1}
.head{background:var(--g);color:#fff;padding:13px 16px;font-weight:700}
label{display:block;font-weight:500;font-size:13.5px;margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus,select:focus{outline:2px solid var(--g2);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--g2);color:#fff;cursor:pointer}
.btn.full{width:100%;margin-top:14px}.btn.sm{padding:6px 12px;font-size:13px}.btn.ghost{background:var(--in);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--redi)}
.total{background:var(--mint);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}.scroll td,.scroll th{white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}.top h3{margin:0}
nav[hidden]{display:none!important}
nav{position:fixed;inset:auto 0 0 0;background:var(--g);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:#cfe0d5;font:inherit;font-size:11.5px;padding:7px 2px;border-radius:12px;position:relative;cursor:pointer}
nav button.on{background:var(--g2);color:#fff;font-weight:700}
nav button.wa{background:rgba(255,255,255,.12);color:#fff;flex:none;padding:7px 12px}
nav i{display:block;font-style:normal;font-size:18px}
.dot{position:absolute;top:0;left:50%;background:var(--sandi);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}
.login{max-width:430px;margin:24px auto}.chips button{margin:4px 0 0 6px}
.mut{color:var(--mut);font-size:13px}.err{color:var(--redi);font-size:13px;margin-top:8px;min-height:18px}
.st-p{color:var(--sandi);font-weight:700}.st-c{color:var(--g2);font-weight:700}.st-r{color:var(--redi);font-weight:700}
.empty{padding:22px;text-align:center;color:var(--mut)}
.wal{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.wal b{display:block;font-size:16px}.wal .mut{margin:4px 0 10px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:8px}.brand b{display:block;font-size:22px;line-height:1.1}.brand small{color:var(--mut);font-size:12px}
.who{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--mut)}
.bell{position:relative;background:none;border:0;font-size:22px;padding:4px;cursor:pointer}
.bell i{position:absolute;top:-2px;right:-4px;background:#c9402c;color:#fff;border-radius:99px;font-size:11px;font-style:normal;padding:1px 6px}
.logout{font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 14px;cursor:pointer}
.kv{background:var(--mint);border-radius:18px;padding:16px}
.kv small{display:block;color:var(--mut);font-size:13px;margin-top:16px}.kv small:first-child{margin-top:0}.kv b{display:block;font-size:19px;margin-top:2px}
.a{display:block;text-align:center;text-decoration:none}
@media print{nav,.noprint{display:none}body{padding:0}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<script>
const SB_URL='https://mxjczdyelwxqapsnlyyr.supabase.co';
const SB_KEY='sb_publishable_VKBe5P1JLHXYMWD7_p6n-w_fabVv80X';
const DOM='@muraisi.app';
const SHOW_DEMO=false; // غيّرها إلى false لإخفاء أزرار التجربة
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id),app=$('app'),N=Number;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(N(n)||0).toLocaleString('en-US');
const today=()=>new Date().toISOString().slice(0,10);
const ym=d=>String(d).slice(0,7).replace('-','/');
const LOGO='<svg width="42" height="32" viewBox="0 0 42 32"><polygon points="2,29 15,6 26,29" fill="#2a4a3a"/><polygon points="15,29 28,10 40,29" fill="#3f6e50"/><rect x="0" y="28" width="42" height="3" rx="1.5" fill="#7bab8a"/></svg>';
let S,me=null,page='home',EW=null,LF=null,LM='';
const blank=()=>({tenants:[],sales:[],payments:[],wallets:[],profiles:[],set:{usd:1600,sar:375,wa:'',theme_color:null}});
S=blank();

/* ---------- أدوات ---------- */
const ok=async p=>{const{error}=await p;if(error){modal(`<p class="st-r">تعذّر الحفظ: ${esc(error.message)}</p>`);return false}return true};
async function api(body){
  const{data,error}=await sb.functions.invoke('admin-api',{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j.error)m=j.error}catch(e){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);
  return data;
}
async function loadAll(){
  const owner=me.role==='owner',q=t=>sb.from(t).select('*');
  const r=await Promise.all([sb.from('settings').select('*').eq('id',1).maybeSingle(),q('tenants'),q('sales'),q('payments'),q('wallets'),owner?q('profiles'):Promise.resolve({data:[]})]);
  const bad=r.find(x=>x.error);if(bad)throw bad.error;
  S.set=r[0].data||S.set;S.tenants=r[1].data;S.sales=r[2].data;S.payments=r[3].data;S.wallets=r[4].data;S.profiles=r[5].data;
  if(S.set.theme_color)document.documentElement.style.setProperty('--g',S.set.theme_color);
}
const T=id=>S.tenants.find(t=>t.id===id)||{name:'—',share:25};
const mt=()=>S.tenants.find(t=>t.user_id===me.id);
const uname=t=>(S.profiles.find(p=>p.id===t.user_id)||{}).username||'-';
const vl=id=>'مستأجر '+([...new Set(S.sales.map(s=>s.tenant_id))].indexOf(id)+1);
function calc(t){
  const sum=f=>S.payments.filter(f).reduce((a,x)=>a+N(x.amount),0);
  const sales=S.sales.filter(x=>x.tenant_id===t.id).reduce((a,x)=>a+N(x.amount),0),owed=sales*N(t.share)/100;
  const paid=sum(x=>x.tenant_id===t.id&&x.status==='c'),pend=sum(x=>x.tenant_id===t.id&&x.status==='p');
  return{sales,owed,paid,pend,left:Math.max(0,owed-paid)};
}
const stat=(v,l,c,w)=>`<div class="stat s-${c} ${w?'wide':''}"><b>${v}</b><span>${l}</span></div>`;
const badge=s=>s==='c'?'<span class="st-c">مؤكدة</span>':s==='p'?'<span class="st-p">بانتظار المراجعة</span>':'<span class="st-r">مرفوضة</span>';
const who=()=>me.role==='owner'?'المالك':me.role==='viewer'?me.username:(mt()||{name:me.username}).name;
const setS=async o=>{if(await ok(sb.from('settings').update(o).eq('id',1))){Object.assign(S.set,o);return true}};

/* ---------- الدخول ---------- */
function loginView(){
  app.innerHTML=`<div class="card login"><div class="pad"><div class="brand" style="margin-bottom:10px">${LOGO}<div><b>مريس</b><small>إدارة الأراضي الزراعية</small></div></div>
  <h2 style="margin-bottom:6px">تسجيل الدخول</h2><p class="mut" style="margin-top:0">الحسابات يصدرها المالك فقط.</p>
  <label>اسم المستخدم</label><input id="u" autocomplete="username" autocapitalize="none">
  <label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="err" id="err"></div><button class="btn full" id="lb" onclick="doLogin()">دخول</button>
  ${SHOW_DEMO?`<div class="card pad chips" style="margin:14px 0 0;background:var(--in)"><div class="mut">حسابات تجربة (أنشئها أولاً من لوحة المالك بكلمة مرور 123456)</div>
  <button class="btn sm ghost" onclick="fill('ahmed','123456')">ahmed</button><button class="btn sm ghost" onclick="fill('salem','123456')">salem</button></div>`:''}</div></div>`;
}
const fill=(u,p)=>{$('u').value=u;$('p').value=p};
async function doLogin(){
  const u=$('u').value.trim().toLowerCase(),p=$('p').value,e=$('err');
  if(!u||!p)return e.textContent='أدخل اسم المستخدم وكلمة المرور.';
  $('lb').disabled=true;e.textContent='';
  const{data,error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+DOM,password:p});
  if(error){$('lb').disabled=false;return e.textContent='اسم المستخدم أو كلمة المرور غير صحيحة.'}
  await start(data.user);
}
async function start(u){
  try{
    const{data:pr,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    if(error)throw error;
    if(!pr)throw new Error('الحساب غير مرتبط بصلاحية. تواصل مع المالك.');
    me=pr;await loadAll();page='home';render();
  }catch(x){await sb.auth.signOut();me=null;render();$('err').textContent=x.message}
}
async function logout(){await sb.auth.signOut();me=null;S=blank();closeM();render();window.scrollTo(0,0)}
const go=p=>{EW=null;page=p;render();window.scrollTo(0,0)};
async function refresh(){try{await loadAll()}catch(x){}render()}

/* ---------- الهيكل ---------- */
function nav(){
  const n=$('nav');
  if(!me||me.role==='viewer'){n.innerHTML='';n.hidden=true;return}
  const o=me.role==='owner',pn=S.payments.filter(p=>p.status==='p').length;
  const items=o?[['home','🏠','الرئيسية'],['tenants','👥','المستأجرون'],['sales','🛒','المبيعات'],['pay','💳','المدفوعات'],['rep','📊','التقارير'],['rates','⚙','الإعدادات']]
   :[['home','🏠','الرئيسية'],['hist','☰','السجل'],['me','👤','بياناتي'],['wa','💬','تواصل معنا']];
  n.hidden=false;
  n.innerHTML=items.map(([k,i,l])=>`<button class="${page===k?'on':''}${k==='wa'?' wa':''}" onclick="${k==='wa'?'openWA()':`go('${k}')`}"><i>${i}</i>${l}${o&&k==='pay'&&pn?`<span class="dot">${pn}</span>`:''}</button>`).join('');
}
function hdr(){
  const o=me.role==='owner',n=o?S.payments.filter(p=>p.status==='p').length:0;
  return `<div class="hdr noprint"><div class="brand">${LOGO}<div><b>مريس</b><small>إدارة الأراضي الزراعية</small></div></div>
  <div class="who"><button class="bell" onclick="${o?"go('pay')":''}">🔔${n?`<i>${n}</i>`:''}</button><span>${esc(who())}</span></div>
  <button class="logout" onclick="logout()">خروج ⎋</button></div>`;
}
function render(){
  if(!me){nav();return loginView()}
  nav();
  ({owner:ownerPage,tenant:tenantPage,viewer:viewerPage})[me.role]();
  app.insertAdjacentHTML('afterbegin',hdr());
}

/* ---------- المراقب ---------- */
function viewerPage(){
  const rows=[...S.sales].sort((a,b)=>b.sale_date.localeCompare(a.sale_date)),total=rows.reduce((s,x)=>s+N(x.amount),0),lbl=me.crop_filter||'كل المحاصيل';
  app.innerHTML=`<div class="card hero"><div class="ico">👁️</div><div><h2>لوحة مراقبة ${esc(lbl)}</h2><p>صلاحية قراءة فقط</p></div></div>
  <div class="card"><div class="head">إجمالي المبيعات</div><div class="pad"><h3 style="margin:0">${fmt(total)} ريال</h3></div></div>
  <div class="card"><div class="head">سجل المبيعات</div><div class="pad scroll"><table><tr><th>التاريخ</th><th>المستأجر</th><th>المحصول</th><th>المبلغ</th></tr>
  ${rows.map(s=>`<tr><td>${esc(s.sale_date)}</td><td>${esc(vl(s.tenant_id))}</td><td>${esc(s.crop)}</td><td>${fmt(s.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد مبيعات.</td></tr>'}</table></div></div>`;
}

/* ---------- المالك ---------- */
function ownerPage(){({home:oHome,tenants:oTenants,sales:oSales,pay:oPay,rates:oRates,rep:oRep,admin:oAdmin}[page]||oHome)()}
function oHome(){
  const a=S.tenants.reduce((a,t)=>{const c=calc(t);a.owed+=c.owed;a.paid+=c.paid;a.pend+=c.pend;return a},{owed:0,paid:0,pend:0});
  app.innerHTML=`<div class="card hero"><div class="ico">🛡</div><div><h2>لوحة المالك</h2><p>${S.tenants.length} أراضٍ - ${S.tenants.filter(t=>t.active).length} حسابات نشطة</p></div></div>
  <div class="grid">${stat(fmt(a.owed),'نصيبك من مبيعات المستأجرين (ريال)','sand',1)}${stat(fmt(a.paid),'المورّد فعلياً (ريال)','mint')}${stat(fmt(a.pend),'بانتظار مراجعتك (ريال)','sky')}
  ${stat((a.paid/S.set.usd).toFixed(2),'المورّد بالدولار','sand')}${stat((a.paid/S.set.sar).toFixed(2),'المورّد بالريال السعودي','mint')}</div>
  <div class="card"><div class="pad top"><h3>المستأجرون والأراضي</h3><button class="btn sm" onclick="go('tenants')">إضافة مستأجر</button></div><div class="scroll"><table><tr><th>المستأجر</th><th>الأرض</th><th>المبيعات</th><th>المورّد</th></tr>
  ${S.tenants.map(t=>{const c=calc(t);return`<tr><td>${esc(t.name)}</td><td>${esc(t.land)}</td><td>${fmt(c.sales)}</td><td>${fmt(c.paid)}</td></tr>`}).join('')}</table></div></div>`;
}

/* المستأجرون */
function oTenants(){
  app.innerHTML=`<div class="card"><div class="pad top"><h3>الحسابات</h3></div><div class="scroll"><table><tr><th>الاسم</th><th>المستخدم</th><th>الهاتف</th><th>النسبة %</th><th>نهاية العقد</th><th></th></tr>
  ${S.tenants.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(uname(t))}</td><td>${esc(t.phone||'-')}</td><td><input type="number" value="${t.share}" style="width:72px;padding:6px" onchange="setShare('${t.id}',this.value)"></td><td>${esc(t.end_date||'-')}</td><td><button class="btn sm red" onclick="delTenant('${t.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد مستأجرون.</td></tr>'}</table></div></div>
  <div class="card"><div class="head">إضافة مستأجر جديد</div><div class="pad">
  <label>الاسم</label><input id="n"><label>الأرض</label><input id="l" placeholder="أرض رقم 004 - الجبارة - مريس">
  <div class="row"><div><label>اسم المستخدم (إنجليزي)</label><input id="u" autocapitalize="none"></div><div><label>كلمة المرور (6+)</label><input id="p"></div></div>
  <div class="row"><div><label>رقم الهاتف</label><input id="ph" inputmode="tel"></div><div><label>نسبة المالك %</label><input id="s" type="number" value="25"></div></div>
  <div class="row"><div><label>بداية العقد</label><input id="ts" type="date" value="${today()}"></div><div><label>نهاية العقد</label><input id="te" type="date"></div></div>
  <div class="err" id="err"></div><button class="btn full" onclick="addTenant()">إضافة المستأجر</button></div></div>`;
}
async function addTenant(){
  const v=id=>$(id).value.trim(),e=$('err');
  if(!v('n')||!v('l')||!v('u'))return e.textContent='أكمل الاسم والأرض واسم المستخدم.';
  if(!/^[a-z0-9._-]+$/i.test(v('u')))return e.textContent='اسم المستخدم بالإنجليزية وأرقام فقط.';
  if(v('p').length<6)return e.textContent='كلمة المرور 6 أحرف على الأقل.';
  e.textContent='جارٍ الإنشاء...';
  try{await api({action:'create_tenant',name:v('n'),land:v('l'),username:v('u'),password:v('p'),phone:v('ph'),share:+v('s')||25,start_date:v('ts')||null,end_date:v('te')||null});await refresh()}
  catch(x){e.textContent=x.message}
}
const delTenant=id=>modal(`<h3 style="margin-top:0">حذف المستأجر؟</h3><p class="mut">سيُحذف مع كل مبيعاته ومدفوعاته وحساب دخوله.</p><button class="btn full red" onclick="doDel('${id}')">نعم، احذف</button>`);
async function doDel(id){
  const t=S.tenants.find(x=>x.id===id);
  if(!await ok(sb.from('tenants').delete().eq('id',id)))return;
  if(t&&t.user_id){try{await api({action:'delete_user',user_id:t.user_id})}catch(e){}}
  closeM();await refresh();
}
async function setShare(id,v){if(+v>=0&&await ok(sb.from('tenants').update({share:+v}).eq('id',id))){const t=S.tenants.find(x=>x.id===id);if(t)t.share=+v}}

/* المبيعات */
function sStat(){
  const m={};
  S.tenants.forEach(t=>{
    let r=S.payments.filter(p=>p.tenant_id===t.id&&p.status!=='r'&&p.img).reduce((a,p)=>a+N(p.amount),0);
    S.sales.filter(x=>x.tenant_id===t.id).sort((a,b)=>a.sale_date.localeCompare(b.sale_date)).forEach(x=>{
      const s=N(x.amount)*N(t.share)/100;
      if(r>=s-.5){m[x.id]='y';r-=s}else if(r>0){m[x.id]='h';r=0}else m[x.id]='n';
    });
  });
  return m;
}
function oSales(){
  const sm=sStat(),L={y:'<span class="st-c">تم رفع السند</span>',h:'<span class="st-p">رُفع جزئياً</span>',n:'<span class="st-r">لم يُرفع</span>'};

function exportXls(){
  const g=k=>$(k).value,e=$('xe'),f=g('xf'),t=g('xt'),tid=g('xs'),day=g('xm')==='day';
  if(!f||!t||f>t)return e.textContent='حدد تاريخ بداية ونهاية صحيحين.';
  if(!window.XLSX)return e.textContent='تعذّر تحميل مكتبة Excel، تأكد من الاتصال بالإنترنت.';
  const R=o=>day&&o.rate?o.rate:S.set,r2=n=>Math.round(n*100)/100;
  const usd=(o,v)=>N(v)/N(R(o).usd),sar=(o,v)=>N(v)/N(R(o).sar),sum=(a,fn)=>r2(a.reduce((s,x)=>s+fn(x),0));
  const ts=S.tenants.filter(x=>!tid||x.id===tid),ids=ts.map(x=>x.id),inR=d=>d>=f&&d<=t,sm=sStat();
  const sl=S.sales.filter(x=>ids.includes(x.tenant_id)&&inR(x.sale_date)).sort((a,b)=>a.sale_date.localeCompare(b.sale_date));
  const pm=S.payments.filter(p=>ids.includes(p.tenant_id)&&inR(p.pay_date)&&p.status==='c');
  const shr=x=>N(x.amount)*N(T(x.tenant_id).share)/100;
  const S1=sum(sl,x=>N(x.amount)),H1=sum(sl,shr),C1=sum(pm,p=>N(p.amount));
  const S2=sum(sl,x=>usd(x,x.amount)),H2=sum(sl,x=>usd(x,shr(x))),C2=sum(pm,p=>usd(p,p.amount));
  const S3=sum(sl,x=>sar(x,x.amount)),H3=sum(sl,x=>sar(x,shr(x))),C3=sum(pm,p=>sar(p,p.amount));
  const A=[['المستأجر','الأرض','النسبة %','المبيعات','نصيبك','المحصّل','المتبقي']];
  ts.forEach(x=>{const s=sum(sl.filter(y=>y.tenant_id===x.id),y=>N(y.amount)),c=sum(pm.filter(p=>p.tenant_id===x.id),p=>N(p.amount)),sh=sum(sl.filter(y=>y.tenant_id===x.id),shr);A.push([x.name,x.land,N(x.share),s,sh,c,r2(sh-c)])});
  A.push(['الإجمالي','','',S1,H1,C1,r2(H1-C1)],[],['الإجمالي بالعملات','المبيعات','نصيبك','المحصّل','المتبقي'],
    ['ريال يمني',S1,H1,C1,r2(H1-C1)],['دولار',S2,H2,C2,r2(H2-C2)],['ريال سعودي',S3,H3,C3,r2(H3-C3)],
    ['سعر الصرف المعتمد',day?'سعر يوم العملية لكل بيع وتحويل':`دولار = ${S.set.usd} ريال يمني، ريال سعودي = ${S.set.sar} ريال يمني (سعر النظام)`]);
  const L={y:'مرفوع',h:'جزئي',n:'غير مرفوع'};
  const B=[['التاريخ','المستأجر','المحصول','الكمية','المبلغ (ريال يمني)','نسبتك (ريال يمني)','المبلغ بالدولار','المبلغ بالريال السعودي','السند']]
    .concat(sl.map(x=>[x.sale_date,T(x.tenant_id).name,x.crop,x.qty||'',N(x.amount),r2(shr(x)),r2(usd(x,x.amount)),r2(sar(x,x.amount)),L[sm[x.id]]||'']),[['الإجمالي','','','',S1,H1,S2,S3,'']]);
  const D=[['التاريخ','المستأجر','المبلغ (ريال يمني)','المحفظة','رقم العملية','سعر الدولار','سعر الريال السعودي','بالدولار','بالريال السعودي']]
    .concat(pm.map(p=>[p.pay_date,T(p.tenant_id).name,N(p.amount),p.wallet||'',p.ref||'',N(R(p).usd),N(R(p).sar),r2(usd(p,p.amount)),r2(sar(p,p.amount))]),[['الإجمالي','',C1,'','','','',C2,C3]]);
  try{
    const wb=XLSX.utils.book_new();
    [['كشف الحساب',A],['المبيعات',B],['المدفوعات',D]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));
    wb.Workbook={Views:[{RTL:true}]};
    const blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`statement-${f}_${t}.xlsx`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);e.textContent='';
  }catch(x){e.textContent='تعذّر حفظ الملف.'}
}

function payCard(t,c){
  const w=S.wallets;
  return `<div class="card" id="pcard"><div class="pad top" style="margin-bottom:0"><h3>توريد للمالك</h3><span class="mut">مورّد ${fmt(c.paid)} ريال</span></div><div class="pad" style="padding-top:6px">
  <p class="mut" style="margin-top:0">حوّل المبلغ إلى إحدى المحافظ ثم أرسل السند. يبقى قيد المراجعة حتى يؤكده المالك.</p>
  ${w.map(x=>`<div class="wal"><b>${esc(x.name)}</b><div class="mut">${esc(x.holder||'')} - ${esc(x.phone)}</div><button class="btn sm ghost" onclick="copyW('${x.id}',this)">نسخ بيانات التحويل</button></div>`).join('')||'<div class="empty">لم يضف المالك محافظ بعد.</div>'}
  <div class="row"><div><label>المبلغ المحوّل (ريال)</label><input id="pa" type="number" inputmode="decimal" value="${Math.max(0,Math.round(c.owed-c.paid-c.pend))||''}"></div>
  <div><label>المحفظة</label><select id="pw">${w.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div>
  <div class="row"><div><label>رقم العملية</label><input id="pr2"></div><div><label>صورة السند (مطلوبة)</label><input id="pf" type="file" accept="image/*"></div></div>
  <div class="err" id="perr"></div><button class="btn full" onclick="sendPay()">إرسال السند</button></div></div>`;
}
function copyW(id,b){
  const w=S.wallets.find(x=>x.id===id);if(!w)return;const t=w.name+' - '+(w.holder||'')+' - '+w.phone;
  const done=()=>{b.textContent='تم النسخ ✓';setTimeout(()=>b.textContent='نسخ بيانات التحويل',1500)};
  try{navigator.clipboard.writeText(t).then(done)}catch(e){}
}
function shrink(f,okf,bad){
  const r=new FileReader();r.onerror=bad;
  r.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);okf(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f);
}
function sendPay(){
  const e=$('perr'),a=+$('pa').value,ref=$('pr2').value.trim(),f=$('pf').files[0],w=S.wallets.find(x=>x.id===$('pw').value),t=mt();
  if(!(a>0))return e.textContent='أدخل المبلغ المحوّل.';
  if(!w)return e.textContent='لا توجد محفظة للتحويل إليها. تواصل مع المالك.';
  if(!f)return e.textContent='أرفق صورة السند أولاً.';
  e.textContent='جارٍ الإرسال...';
  shrink(f,async img=>{
    const p={tenant_id:t.id,amount:a,pay_date:today(),wallet:w.name,ref,img,status:'p',rate:{usd:S.set.usd,sar:S.set.sar}};
    if(!await ok(sb.from('payments').insert(p)))return;
    LF=f;page='hist';await refresh();waAfter(p);
  },()=>{e.textContent='تعذّر قراءة الصورة، جرّب صورة أخرى.'});
}
function tMe(){
  const t=mt();if(!t)return noT();const c=calc(t),r=(l,v)=>`<small>${l}</small><b>${esc(v||'-')}</b>`;
  app.innerHTML=`<div class="card pad"><h3 style="margin-top:0">بياناتي</h3><div class="kv">${r('الاسم',t.name)}${r('اسم المستخدم',me.username)}${r('الأرض',t.land)}${r('رقم الهاتف',t.phone)}${r('اتفاق المالك',t.share+'% من المبيعات')}${r('بداية العقد',t.start_date)}${r('نهاية العقد',t.end_date)}${r('إجمالي المبيعات',fmt(c.sales)+' ريال')}${r('نصيب المالك',fmt(c.owed)+' ريال')}${r('المورّد المؤكد',fmt(c.paid)+' ريال')}</div>
  <div class="alert" style="margin-top:15px;background:var(--sky);color:var(--ink)">🔒 تغيير كلمة المرور يتم عبر التواصل مع المالك.</div></div>`;
}

/* ---------- واتساب ونوافذ ---------- */
const waUrl=m=>`https://wa.me/${(S.set.wa||'').replace(/\D/g,'')}?text=${encodeURIComponent(m)}`;
function waAfter(p){
  const m=`السلام عليكم، أنا ${mt().name}.\nأرسلت توريداً بمبلغ ${fmt(p.amount)} ريال إلى ${p.wallet}${p.ref?`\nرقم العملية: ${p.ref}`:''}\nمرفق صورة السند، أرجو التأكيد.`;
  LM=m;
  if(!S.set.wa)return modal('<h3 style="margin-top:0">تم إرسال التوريد للمراجعة</h3><p class="mut">لم يضف المالك رقم واتساب بعد.</p>');
  const can=LF&&navigator.canShare&&navigator.canShare({files:[LF]});
  modal(`<h3 style="margin-top:0">تم إرسال التوريد للمراجعة</h3><p class="mut">أرسل السند للمالك على واتساب.</p>
  <div class="total" style="white-space:pre-wrap;margin-top:0">${esc(m)}</div>
  ${can?'<button class="btn full" onclick="shareWA()">إرسال السند عبر واتساب</button>':''}
  <a class="btn full a ${can?'ghost':''}" target="_blank" rel="noopener" href="${waUrl(m)}">${can?'إرسال الرسالة فقط':'فتح واتساب بالرسالة الجاهزة'}</a>`);
}
const shareWA=()=>navigator.share({files:[LF],text:LM}).catch(()=>{});
function openWA(){
  const m=`السلام عليكم، أنا ${mt().name}، أحتاج مساعدة بخصوص حسابي.`;
  modal(S.set.wa?`<h3 style="margin-top:0">تواصل معنا</h3><a class="btn full a" target="_blank" rel="noopener" href="${waUrl(m)}">فتح واتساب</a>`:'<h3 style="margin-top:0">تواصل معنا</h3><p class="mut">لم يضف المالك رقم واتساب بعد.</p>');
}
function modal(h){
  closeM();const o=document.createElement('div');o.id='md';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:grid;place-items:center;padding:16px';
  o.innerHTML=`<div class="card pad" style="width:100%;max-width:420px;max-height:90vh;overflow:auto;margin:0">${h}<button class="btn full ghost" onclick="closeM()">إغلاق</button></div>`;document.body.appendChild(o);
}
function closeM(){const o=$('md');if(o)o.remove()}

/* ---------- البدء ---------- */
(async()=>{
  const{data}=await sb.auth.getSession();
  if(data.session)await start(data.session.user);else render();
})();
</script>
